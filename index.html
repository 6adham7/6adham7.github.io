<style>
  :root{
    --bg: #000000;
    --panel: #0C0C0C;
    --panel-2: #131313;
    --line: #262626;
    --ink: #F5F5F5;
    --muted: #8C8C8C;
    --white: #FFFFFF;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ scroll-behavior:smooth; }

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    overflow-x:hidden;
  }

  ::selection{ background:var(--white); color:#000; }
  a{ color:inherit; text-decoration:none; }
  button{ font:inherit; cursor:pointer; }

  .wrap{ max-width:1000px; margin:0 auto; padding:0 24px; }

  /* ---------- top ticker ---------- */
  .marquee{
    background:var(--white);
    color:#000;
    overflow:hidden;
    white-space:nowrap;
    padding:8px 0;
    font-family:'JetBrains Mono', monospace;
    font-weight:500;
    font-size:0.82rem;
    letter-spacing:0.06em;
  }
  .marquee-track{ display:inline-flex; will-change:transform; }
  .marquee-track .mq-item{ padding:0 20px; display:inline-flex; align-items:center; gap:10px; text-transform:uppercase; flex-shrink:0; }

  nav{
    position:sticky; top:0; z-index:50;
    background:rgba(0,0,0,0.75);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  nav .wrap{ display:flex; align-items:center; justify-content:center; height:64px; position:relative; }
  .logo{
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:1.1rem;
    letter-spacing:0.02em; position:absolute; left:24px; display:flex; align-items:center; gap:8px;
  }
  .logo .dot{ width:7px; height:7px; border-radius:50%; background:var(--white); animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:1; transform:scale(1); } 50%{ opacity:0.35; transform:scale(0.7); } }

  header.hero{ padding:70px 0 10px; position:relative; }

  /* ambient waveform behind hero — full-width canvas, continuous motion */
  .wave-field{
    position:absolute; left:0; right:0; top:-20px; width:100vw; height:520px;
    opacity:0.55; pointer-events:none;
    mask-image:linear-gradient(to bottom, rgba(0,0,0,0.9), transparent 90%);
    -webkit-mask-image:linear-gradient(to bottom, rgba(0,0,0,0.9), transparent 90%);
  }
  .wave-field canvas{ display:block; width:100%; height:100%; }

  .hero-inner{ position:relative; z-index:2; }

  .eyebrow{
    font-family:'JetBrains Mono', monospace; font-size:0.78rem; color:var(--muted);
    letter-spacing:0.14em; text-transform:uppercase; margin-bottom:18px; text-align:center;
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .eyebrow::before, .eyebrow::after{ content:''; width:24px; height:1px; background:var(--line); }

  /* tiny live level-meter next to the eyebrow tag */
  .live-meter{ display:inline-flex; align-items:flex-end; gap:2px; height:11px; }
  .live-meter i{
    display:block; width:2.5px; background:var(--muted); border-radius:1px;
    animation:meterBounce 0.9s ease-in-out infinite;
  }
  .live-meter i:nth-child(1){ height:40%; animation-delay:0s; }
  .live-meter i:nth-child(2){ height:100%; animation-delay:0.15s; }
  .live-meter i:nth-child(3){ height:65%; animation-delay:0.3s; }
  .live-meter i:nth-child(4){ height:85%; animation-delay:0.45s; }
  @keyframes meterBounce{
    0%,100%{ transform:scaleY(0.35); opacity:0.5; }
    50%{ transform:scaleY(1); opacity:1; }
  }

  /* animated skills strip — signals range of craft at a glance */
  .skills-strip{
    display:flex; justify-content:center; flex-wrap:wrap; gap:10px;
    margin-top:28px; max-width:640px; margin-left:auto; margin-right:auto;
  }
  .skill-pill{
    display:inline-flex; align-items:center; gap:7px;
    padding:8px 16px; border-radius:100px;
    border:1px solid var(--line); background:var(--panel);
    font-family:'JetBrains Mono', monospace; font-size:0.78rem; color:var(--muted);
    letter-spacing:0.02em;
    opacity:0; transform:translateY(10px);
    animation:pillIn 0.5s ease forwards;
    transition:border-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
  }
  .skill-pill:hover{ border-color:var(--white); color:var(--ink); transform:translateY(-2px); }
  .skill-pill svg{ width:13px; height:13px; flex-shrink:0; opacity:0.8; }
  .skill-pill .sp-dot{
    width:5px; height:5px; border-radius:50%; background:var(--white);
    animation:pillPulse 2.2s ease-in-out infinite;
  }
  @keyframes pillIn{ to{ opacity:1; transform:translateY(0); } }
  @keyframes pillPulse{ 0%,100%{ opacity:0.3; } 50%{ opacity:1; } }

  h1.name{
    font-family:'Space Grotesk', sans-serif; font-weight:700;
    font-size:clamp(2.6rem, 8vw, 4.6rem); text-align:center; line-height:1.05; color:var(--white);
  }

  .type-line{
    text-align:center; font-family:'Space Grotesk', sans-serif; font-weight:600;
    font-size:clamp(1.15rem, 3vw, 1.6rem); color:var(--muted);
    margin-top:10px; min-height:2.2em;
  }
  .cursor{ display:inline-block; width:2px; background:var(--white); margin-left:2px; animation:blink 0.9s step-end infinite; }
  @keyframes blink{ 50%{ opacity:0; } }

  .bio{ max-width:540px; margin:24px auto 0; text-align:center; color:var(--muted); font-size:1rem; line-height:1.7; }

  .tab-row{
    display:flex; justify-content:center; gap:12px;
    margin-top:40px; flex-wrap:wrap;
  }
  .tab-btn{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:0.92rem;
    padding:13px 24px;
    border-radius:100px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--ink);
    display:inline-flex;
    align-items:center;
    gap:8px;
    transition:transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }
  .tab-btn:hover{ transform:translateY(-2px); border-color:var(--white); }
  .tab-btn.active{
    background:var(--white);
    color:#000;
    border-color:var(--white);
    box-shadow:0 5px 0 var(--line);
    transform:translateY(-2px);
  }
  .tab-btn svg{ width:17px; height:17px; flex-shrink:0; }
  .tab-btn .chev{ width:13px; height:13px; transition:transform 0.25s ease; }
  .tab-btn.active .chev{ transform:rotate(180deg); }
  .discord-ic path{ fill:currentColor; }

  /* ---------- panels ---------- */
  .panels{ padding:10px 0 80px; }
  .panel{
    max-height:0;
    overflow:hidden;
    opacity:0;
    transform:translateY(-8px);
    transition:max-height 0.45s ease, opacity 0.35s ease, transform 0.35s ease, margin 0.45s ease;
    margin-top:0;
  }
  .panel.open{
    max-height:3000px;
    opacity:1;
    transform:translateY(0);
    margin-top:40px;
  }

  .section-head{ text-align:center; margin-bottom:32px; }
  .section-tag{ font-family:'JetBrains Mono', monospace; font-size:0.75rem; color:var(--muted); letter-spacing:0.12em; text-transform:uppercase; }
  h2{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:clamp(1.5rem, 4vw, 2rem); margin-top:6px; color:var(--white); }

  .grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:20px; }
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:16px; overflow:hidden;
    display:block; width:100%; text-align:left; padding:0; font:inherit; color:inherit;
    transition:transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    opacity:0; transform:translateY(16px);
  }
  .card.reveal{ animation:cardIn 0.5s ease forwards; }
  @keyframes cardIn{ to{ opacity:1; transform:translateY(0); } }
  .card:hover{ transform:translateY(-5px); box-shadow:0 10px 0 var(--line); border-color:var(--white); }
  .card.reveal:hover{ transform:translateY(-5px); }
  .thumb{ position:relative; aspect-ratio:16/9; width:100%; background:var(--panel-2); overflow:hidden; }
  .thumb img{ width:100%; height:100%; object-fit:cover; display:block; filter:grayscale(0.15); }
  .play{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0); transition:background 0.2s ease; }
  .card:hover .play{ background:rgba(0,0,0,0.35); }
  .play svg{ width:44px; height:44px; opacity:0; transition:opacity 0.2s ease; filter:drop-shadow(0 2px 6px rgba(0,0,0,0.5)); }
  .card:hover .play svg{ opacity:1; }
  .card-body{ padding:15px 17px 18px; }
  .card-body .num{ font-family:'JetBrains Mono', monospace; font-size:0.72rem; color:var(--muted); }
  .card-body h3{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:1rem; margin-top:4px; }

  .empty-state{
    text-align:center; color:var(--muted); font-family:'JetBrains Mono', monospace;
    font-size:0.85rem; padding:40px 20px; border:1px dashed var(--line); border-radius:16px;
  }

  .about-card{ background:var(--panel); border:1px solid var(--line); border-radius:22px; padding:46px; max-width:680px; margin:0 auto; text-align:center; }
  .about-card h3{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:clamp(1.4rem, 3.5vw, 1.9rem); margin-bottom:6px; color:var(--white); }
  .about-card .subhead{ font-family:'JetBrains Mono', monospace; color:var(--muted); font-size:0.85rem; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:18px; }
  .about-card p{ color:var(--muted); font-size:1.02rem; line-height:1.75; }
  .about-meta{ display:flex; justify-content:center; gap:28px; margin-top:26px; flex-wrap:wrap; }
  .about-meta div{ text-align:center; }
  .about-meta .k{ font-family:'JetBrains Mono', monospace; font-size:0.7rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.1em; }
  .about-meta .v{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:1.05rem; color:var(--white); margin-top:4px; }

  .contact-card{ background:var(--white); color:#000; border-radius:22px; padding:48px; text-align:center; box-shadow:0 8px 0 var(--line); max-width:600px; margin:0 auto; }
  .contact-card h2{ color:#000; }
  .contact-card p{ color:#4a4a4a; margin-top:8px; }
  .discord-pill{
    display:inline-flex; align-items:center; gap:10px; background:#000; color:#fff;
    padding:14px 26px; border-radius:100px; font-family:'JetBrains Mono', monospace; font-size:0.92rem; font-weight:500; margin-top:24px;
    transition:transform 0.15s ease;
  }
  .discord-pill:hover{ transform:translateY(-2px); }
  .discord-pill svg{ width:19px; height:19px; }

  footer{ padding:30px 0 46px; text-align:center; color:var(--muted); font-size:0.82rem; font-family:'JetBrains Mono', monospace; }

  /* ---------- video modal ---------- */
  .video-modal{
    position:fixed; inset:0; z-index:200;
    display:none;
    align-items:center; justify-content:center;
    background:rgba(0,0,0,0.85);
    padding:20px;
  }
  .video-modal.open{ display:flex; }
  .video-modal-inner{
    width:100%; max-width:860px;
    background:#000;
    border-radius:16px;
    overflow:hidden;
    position:relative;
    box-shadow:0 20px 60px rgba(0,0,0,0.6);
    border:1px solid var(--line);
  }
  .video-modal-inner .frame-wrap{ position:relative; width:100%; aspect-ratio:16/9; }
  .video-modal-inner iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
  .modal-close{
    position:absolute; top:-44px; right:0;
    background:#fff; color:#000;
    width:34px; height:34px; border-radius:50%;
    border:none; display:flex; align-items:center; justify-content:center;
    font-size:1.05rem; font-weight:700;
  }
  .modal-close:hover{ background:#ccc; }

  .watch-fallback{
    display:block; text-align:center; padding:14px 12px;
    font-family:'JetBrains Mono', monospace; font-size:0.82rem;
    color:#B3B3B3; background:#0C0C0C; border-top:1px solid var(--line);
    transition:color 0.2s ease;
  }
  .watch-fallback:hover{ color:#fff; }

  @media (max-width:640px){
    .about-card, .contact-card{ padding:30px 22px; }
    .about-meta{ gap:20px; }
  }
</style>

<script>
  // ---------- helpers ----------
  function extractYouTubeId(url){
    try{
      const u = new URL(url.trim());
      if(u.hostname.includes('youtu.be')){
        return u.pathname.slice(1).split('/')[0];
      }
      if(u.hostname.includes('youtube.com')){
        if(u.searchParams.get('v')) return u.searchParams.get('v');
        const parts = u.pathname.split('/').filter(Boolean);
        const i = parts.findIndex(p => p === 'embed' || p === 'shorts');
        if(i !== -1 && parts[i+1]) return parts[i+1];
      }
    }catch(e){ /* not a valid URL */ }
    return null;
  }

  // ---------- fill in text content from CONFIG ----------
  document.getElementById('navName').textContent = CONFIG.NAME.toUpperCase();
  document.getElementById('heroName').textContent = CONFIG.NAME;
  document.getElementById('bioText').textContent = CONFIG.BIO;
  document.getElementById('aboutName').textContent = "Hi, I'm " + CONFIG.NAME;
  document.getElementById('aboutSubhead').textContent = CONFIG.ABOUT_SUBHEAD;
  document.getElementById('aboutText').textContent = CONFIG.ABOUT_TEXT;
  document.getElementById('aboutAge').textContent = CONFIG.AGE;
  document.getElementById('aboutDiscord').textContent = CONFIG.DISCORD_USERNAME;
  document.getElementById('discordLabel').textContent = CONFIG.DISCORD_USERNAME;
  document.getElementById('discordPill').href = "https://discord.com/users/" + encodeURIComponent(CONFIG.DISCORD_USERNAME);
  document.getElementById('footerText').textContent = CONFIG.NAME + " — sound designer portfolio";

  // ---------- top ticker: continuous, non-stop, no jump on loop ----------
  // Instead of the classic CSS translateX(-50%) keyframe trick (which can
  // visibly "snap" if the two halves ever render at slightly different
  // widths — e.g. while a webfont is swapping in), this measures the exact
  // pixel width of one copy and uses (elapsed * speed) % singleWidth to
  // position it. That value can never drift or mismatch, so the strip
  // scrolls left forever and the next copy always slides in from the right
  // at exactly the right moment — perfectly seamless, no teleporting.
  (function buildMarquee(){
    const track = document.getElementById('marqueeTrack');
    const container = track ? track.parentElement : null;
    if(!track || !container) return;

    const template = track.innerHTML; // one copy of the ticker content
    let singleWidth = 0;

    function fillTrack(){
      track.innerHTML = template;
      singleWidth = track.firstElementChild.getBoundingClientRect().width;
      // Keep adding copies until the strip comfortably covers container
      // width plus one extra copy, so there's never a gap on the right.
      let guard = 0;
      while(track.scrollWidth < container.clientWidth + singleWidth * 2 && guard < 50){
        track.insertAdjacentHTML('beforeend', template);
        guard++;
      }
    }
    fillTrack();
    window.addEventListener('resize', fillTrack);
    if(window.ResizeObserver){ new ResizeObserver(fillTrack).observe(container); }
    if(document.fonts && document.fonts.ready){ document.fonts.ready.then(fillTrack); }

    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){ return; } // stay static

    const SPEED = 55; // px per second
    let elapsed = 0;
    let last = performance.now();

    function step(now){
      const dt = Math.min(now - last, 50) / 1000;
      last = now;
      elapsed += dt * SPEED;
      if(singleWidth > 0){
        const x = -(elapsed % singleWidth);
        track.style.transform = `translateX(${x}px)`;
      }
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();

  // ---------- animated skills strip ----------
  (function buildSkillsStrip(){
    const strip = document.getElementById('skillsStrip');
    const skills = (CONFIG.SKILLS && CONFIG.SKILLS.length) ? CONFIG.SKILLS : [];
    skills.forEach((label, i) => {
      const pill = document.createElement('span');
      pill.className = 'skill-pill';
      pill.style.animationDelay = (0.5 + i * 0.09) + 's';
      pill.innerHTML = `<span class="sp-dot" style="animation-delay:${(i * 0.25)}s"></span>${label}`;
      strip.appendChild(pill);
    });
  })();

  // ---------- typing effect ----------
  const words = (CONFIG.TAGLINE_WORDS && CONFIG.TAGLINE_WORDS.length) ? CONFIG.TAGLINE_WORDS : ["impact."];
  const typedEl = document.getElementById('typed');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let wi = 0, ci = 0, deleting = false;

  function tick(){
    const word = words[wi];
    if(!deleting){
      ci++;
      typedEl.textContent = "I craft " + word.slice(0, ci);
      if(ci === word.length){ deleting = true; setTimeout(tick, 1400); return; }
    } else {
      ci--;
      typedEl.textContent = "I craft " + word.slice(0, ci);
      if(ci === 0){ deleting = false; wi = (wi + 1) % words.length; }
    }
    setTimeout(tick, deleting ? 45 : 75);
  }
  if(reduced){ typedEl.textContent = "I craft " + words[0]; } else { tick(); }

  // ---------- ambient waveform (decorative, behind hero) ----------
  // Overlapping sine waves of different speed/phase per bar column — an
  // organic, ever-moving profile behind the hero. Nothing ever pops in or
  // stalls: each bar is mid-motion continuously, the whole field is one
  // uninterrupted, looping ripple.
  (function buildWaveField(){
    const field = document.getElementById('waveField');
    const canvas = document.getElementById('waveCanvas');
    if(!field || !canvas) return;
    if(reduced){ field.style.display = 'none'; return; }

    const ctx = canvas.getContext('2d');
    let W = 0, H = 0, barW, gap, barCount;

    function resize(){
      const rect = field.getBoundingClientRect();
      W = Math.ceil(rect.width);
      H = Math.ceil(rect.height);
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(W, 1) * dpr;
      canvas.height = Math.max(H, 1) * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      barW = W < 600 ? 3 : 4;
      gap = W < 600 ? 4 : 6;
      barCount = Math.floor(W / (barW + gap));
    }
    resize();
    window.addEventListener('resize', resize);
    // Self-heals if the very first measurement ever comes back as 0 (e.g. a
    // slow-loading stylesheet) — no dependency on the user resizing anything.
    if(window.ResizeObserver){ new ResizeObserver(resize).observe(field); }
    if(document.fonts && document.fonts.ready){ document.fonts.ready.then(resize); }

    let last = performance.now();
    let t = 0;

    function draw(now){
      const dt = Math.min(now - last, 50) / 1000;
      last = now;
      t += dt;

      if(W === 0 || H === 0){ requestAnimationFrame(draw); return; }

      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = '#FFFFFF';

      for(let i = 0; i < barCount; i++){
        const x = i * (barW + gap);
        const phase = i * 0.35;
        const wave =
          Math.sin(t + phase) * 0.5 +
          Math.sin(t * 0.6 + phase * 1.7) * 0.3 +
          Math.sin(t * 1.4 + phase * 0.5) * 0.2;
        const norm = (wave + 1) / 2; // 0..1
        const minH = H * 0.06;
        const maxH = H * 0.92;
        const h = minH + norm * (maxH - minH);

        ctx.globalAlpha = 0.35 + norm * 0.5;
        ctx.beginPath();
        const r = barW / 2;
        const y = H - h;
        if(ctx.roundRect){
          ctx.roundRect(x, y, barW, h, r);
        } else {
          ctx.rect(x, y, barW, h);
        }
        ctx.fill();
      }
      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
  })();

  // ---------- build video grid dynamically from CONFIG.YOUTUBE_LINKS ----------
  (function buildVideoGrid(){
    const grid = document.getElementById('videoGrid');
    const countLabel = document.getElementById('workCount');
    const ids = CONFIG.YOUTUBE_LINKS.map(extractYouTubeId).filter(Boolean);

    countLabel.textContent = "Portfolio — " + ids.length + (ids.length === 1 ? " video" : " videos");

    if(ids.length === 0){
      grid.innerHTML = '<div class="empty-state">No videos yet — add YouTube links to CONFIG.YOUTUBE_LINKS at the top of the file.</div>';
      return;
    }

    ids.forEach((id, index) => {
      const card = document.createElement('button');
      card.className = 'card';
      card.dataset.video = id;
      card.setAttribute('aria-haspopup', 'dialog');

      const num = String(index + 1).padStart(2, '0');

      card.innerHTML = `
        <div class="thumb">
          <img src="https://img.youtube.com/vi/${id}/hqdefault.jpg" alt="" referrerpolicy="no-referrer" loading="lazy">
          <div class="play"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="11" stroke="white" stroke-width="1.5"/><path d="M10 8L16 12L10 16V8Z" fill="white"/></svg></div>
        </div>
        <div class="card-body">
          <div class="num">${num}</div>
          <h3>SFX showcase</h3>
        </div>`;

      card.addEventListener('click', () => openVideo(id));
      grid.appendChild(card);
    });
  })();

  // ---------- video modal ----------
  const modal = document.getElementById('videoModal');
  const modalFrame = document.getElementById('modalFrame');
  const modalClose = document.getElementById('modalClose');
  const watchFallback = document.getElementById('watchOnYoutube');

  function openVideo(id){
    // youtube-nocookie.com + an explicit origin avoids most embed
    // (error 153 / "player configuration error") issues; the fallback
    // link below the player always works even if embedding is blocked
    // for a specific video or environment.
    const origin = encodeURIComponent(window.location.origin);
    modalFrame.src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0&modestbranding=1&origin=${origin}`;
    watchFallback.href = `https://www.youtube.com/watch?v=${id}`;
    modal.classList.add('open');
  }
  function closeVideo(){
    modal.classList.remove('open');
    modalFrame.src = '';
  }
  modalClose.addEventListener('click', closeVideo);
  modal.addEventListener('click', (e) => { if(e.target === modal) closeVideo(); });
  document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeVideo(); });

  // ---------- tab buttons -> toggle panels ----------
  const buttons = document.querySelectorAll('.tab-btn');
  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      const targetId = 'panel-' + btn.dataset.panel;
      const panel = document.getElementById(targetId);
      const isOpen = panel.classList.contains('open');

      document.querySelectorAll('.panel').forEach(p => p.classList.remove('open'));
      buttons.forEach(b => { b.classList.remove('active'); b.setAttribute('aria-selected', 'false'); });

      if(!isOpen){
        panel.classList.add('open');
        btn.classList.add('active');
        btn.setAttribute('aria-selected', 'true');
        setTimeout(() => {
          panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 120);

        if(targetId === 'panel-work'){
          const cards = panel.querySelectorAll('.card');
          cards.forEach(c => c.classList.remove('reveal'));
          // force reflow so the animation restarts every time the tab reopens
          void panel.offsetWidth;
          cards.forEach((c, i) => {
            c.style.animationDelay = (i * 0.07) + 's';
            c.classList.add('reveal');
          });
        }
      }
    });
  });
</script>
